name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT_DIR: .
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        # The repo ships without gradlew / gradle-wrapper.jar, so we install
        # Gradle directly. Also enables dependency + build caching.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Prepare signing keystore
        id: keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_PATH="$RUNNER_TEMP/release.keystore"

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Using keystore from repository secrets."
            echo "${KEYSTORE_BASE64}" | base64 --decode > "$KS_PATH"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS}"                 >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"           >> "$GITHUB_ENV"
            echo "signed_with=secrets" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found - generating a throwaway keystore. Add signing secrets before distributing this APK."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" -storetype PKCS12 \
              -alias volunteernews24 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tempstorepass -keypass tempstorepass \
              -dname "CN=VolunteerNews24 CI, OU=CI, O=VolunteerNews24, C=BD"
            echo "KEYSTORE_PASSWORD=tempstorepass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=volunteernews24"         >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=tempstorepass"      >> "$GITHUB_ENV"
            echo "signed_with=throwaway" >> "$GITHUB_OUTPUT"
          fi

          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleRelease
          fi

      - name: Collect APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under app/build/outputs/apk/release"
            exit 1
          fi

          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          OUT_NAME="VolunteerNews24-v${VERSION}-release.apk"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$APK" "$RUNNER_TEMP/dist/$OUT_NAME"

          echo "Built: $OUT_NAME ($(du -h "$APK" | cut -f1))"
          echo "path=$RUNNER_TEMP/dist/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VolunteerNews24 ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Release APK for VolunteerNews24 **${{ steps.apk.outputs.version }}**.

            Signed with: `${{ steps.keystore.outputs.signed_with }}` keystore.
            Min Android 8.0 (API 26).
