name: Build Release APK

# Builds a signed release APK of Content Studio (Kotlin + Jetpack Compose).
#
# v2: auto-detects where the Android project lives inside the repo, so the build
# no longer fails with "task 'assembleRelease' not found in project ':app'"
# when the project sits in a sub-folder (e.g. app/ from the template zip).
#
# Required repository secrets (optional - a throwaway key is generated if absent):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate the Android project
        id: locate
        run: |
          set -euo pipefail
          # Find every settings.gradle(.kts) and pick the one whose :app module
          # actually has a build file with the Android application plugin.
          BEST=""
          while IFS= read -r s; do
            d=$(dirname "$s")
            if [ -f "$d/app/build.gradle.kts" ] || [ -f "$d/app/build.gradle" ]; then
              BEST="$d"; break
            fi
            [ -z "$BEST" ] && BEST="$d"
          done < <(find . -maxdepth 3 -name 'settings.gradle*' -not -path '*/build/*' | sort)

          if [ -z "$BEST" ]; then
            echo "::error::No settings.gradle(.kts) found in the repository. Upload the Android project (settings.gradle.kts, build.gradle.kts, app/) to the repo."
            find . -maxdepth 3 -type d -not -path '*/.git*' | sed 's|^|  |'
            exit 1
          fi

          echo "Android project root: $BEST"
          echo "dir=$BEST" >> "$GITHUB_OUTPUT"

          if [ ! -f "$BEST/app/build.gradle.kts" ] && [ ! -f "$BEST/app/build.gradle" ]; then
            echo "::error::'$BEST/app/build.gradle.kts' is missing - that is exactly why Gradle reports 'assembleRelease not found in project :app'. The :app module was included in settings.gradle.kts but its build file was never uploaded."
            echo "Contents of $BEST:"; ls -la "$BEST"
            echo "Contents of $BEST/app (if any):"; ls -la "$BEST/app" || true
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Prepare signing keystore
        id: keystore
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_PATH="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using keystore from repository secrets."
            echo "${KEYSTORE_BASE64}" | base64 --decode > "$KS_PATH"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS}"                 >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"           >> "$GITHUB_ENV"
            echo "signed_with=secrets" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found - generating a throwaway keystore."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" -storetype PKCS12 \
              -alias contentstudio -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tempstorepass -keypass tempstorepass \
              -dname "CN=Content Studio CI, OU=CI, O=ContentStudio, C=US"
            echo "KEYSTORE_PASSWORD=tempstorepass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=contentstudio"         >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=tempstorepass"      >> "$GITHUB_ENV"
            echo "signed_with=throwaway" >> "$GITHUB_OUTPUT"
          fi
          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Show Gradle projects and tasks (diagnostics)
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: gradle --no-daemon projects

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleRelease
          fi

      - name: Collect APK
        id: apk
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under app/build/outputs/apk/release"
            exit 1
          fi
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          OUT_NAME="ContentStudio-v${VERSION}-release.apk"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$APK" "$RUNNER_TEMP/dist/$OUT_NAME"
          echo "Built: $OUT_NAME ($(du -h "$APK" | cut -f1))"
          echo "path=$RUNNER_TEMP/dist/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Content Studio ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Release APK for Content Studio **${{ steps.apk.outputs.version }}**.

            Signed with: `${{ steps.keystore.outputs.signed_with }}` keystore.
            Min Android 8.0 (API 26).
